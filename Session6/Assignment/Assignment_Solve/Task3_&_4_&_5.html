<!DOCTYPE html>
<html>

<head>
    <title>Form</title>
    <meta charset="UTF-8">
    <meta name="description" content="This is page description">

<body>
    <form method="GET">
        <label for="token">Token</label>
        <input type="text" id="token" value="b92f1fc2fce391ad7af633723afd3055" hidden name="token">

        <input type="checkbox" name="skills" id="c1" checked value="Problem Solving">

        <input type="checkbox" name="skills" id="c2" value="Logical Thinking">

        <br>
        <input type="checkbox" name="skills" id="c4" value="Analysis">

        <br>
        <input type="checkbox" name="skills" id="c5" value="Planning">
        <label for="c5">Planning</label>
        <hr>
        <input type="radio" name="job" id="r1" checked value="Front-End Developer">
        <label for="r1">Front-End Developer</label>
        <br>
        <input type="radio" name="job" id="r2" value="Back-End Developer">

        <input type="radio" name="job" id="r3" value="Business Analyst">

        <input type="radio" name="job" id="r4" value="Project Manager">

        <input type="radio" name="job" id="r5" value="Scrum Master">

            <optgroup label="Python">
                <option value="2">v2.0</option>
                <option value="3">v3.0</option>
                <option value="3.9">v3.9</option>
            </optgroup>
        </select>
        <hr>
        <textarea name="brief" id="txtarea" placeholder="Write Here Why You Want To Learn Programming" cols="40" rows="5"></textarea>
        <br><br>
        <input type="reset" value="Empty">
        <input type="submit" value="Send">
    </form>
</body>

</html>
