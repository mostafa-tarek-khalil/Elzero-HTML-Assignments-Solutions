<!DOCTYPE html>
<html>
    <head>
        <title>Form</title>
        <meta charset="UTF-8">
        <meta name="description" content="This is page description">
    </head>
    <body>
        <form target="_blank" novalidate>
           <label for="search">Search</label>
           <br>
           <input type="search" id="search" placeholder="Enter A Search Word" autofocus>
           <br><br>
           <label for="file">File</label>
           <br>
           <input type="file" id="file">
           <br><br>
           <label for="url">URL</label>
           <br>
           <input type="url" id="url" required>
           <br><br>
           <label for="date">Date</label>
           <input type="date" name="date" id="date" value="2007-02-06">
           <br><br>
           <label for="mon">Month</label>
           <input type="month" name="month" id="mon" value="2007-02">
           <br><br>
           <input type="reset" value="Empty">
           <br><br>
           <input type="reset" value="Empty">
           <input type="submit" value="Save">
        </form>
    </body>
</html>
